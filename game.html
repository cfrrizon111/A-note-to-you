<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Moon Is Alive</title>

<style>
body{
margin:0;
background:#030617;
color:white;
font-family:Georgia,serif;
overflow:hidden;
}

#moon{
width:180px;
height:180px;
border-radius:50%;
background:white;
box-shadow:0 0 80px rgba(255,255,255,.8);
position:absolute;
top:20%;
left:50%;
transform:translateX(-50%);
}

#message{
position:absolute;
bottom:25%;
width:100%;
text-align:center;
font-size:1.5rem;
padding:20px;
}

.buttons{
position:absolute;
bottom:12%;
width:100%;
text-align:center;
}

button{
padding:12px 25px;
margin:10px;
font-size:1rem;
border:none;
border-radius:10px;
cursor:pointer;
}

.stars{
position:absolute;
width:100%;
height:100%;
pointer-events:none;
}

.star{
position:absolute;
width:4px;
height:4px;
background:white;
border-radius:50%;
opacity:.7;
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div id="moon"></div>

<div id="message">
Hello.
</div>

<div class="buttons" id="buttons">
<button onclick="startStory()">Continue</button>
</div>

<script>

for(let i=0;i<120;i++){

const star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"%";

star.style.top=Math.random()*100+"%";

document.getElementById("stars").appendChild(star);

}

const message=document.getElementById("message");

const buttons=document.getElementById("buttons");

let answer1="";

function startStory(){

message.innerHTML=
"I've been watching your journey.";

buttons.innerHTML=
'<button onclick="question1()">Continue</button>';

}

function question1(){

message.innerHTML=
"Do you believe people ever truly disappear?";

buttons.innerHTML=
`
<button onclick="answer('yes')">Yes</button>
<button onclick="answer('no')">No</button>
`;

}

function answer(choice){

answer1=choice;

message.innerHTML=
"I knew you'd choose that.";

buttons.innerHTML=
'<button onclick="phase2()">Continue</button>';

}

function phase2(){

message.innerHTML=
"Still searching for an ending?";

buttons.innerHTML=
'<button onclick="phase3()">Maybe</button>';

}

function phase3(){

message.innerHTML=
"There are no stars to collect.";

buttons.innerHTML=
'<button onclick="phase4()">Then why am I here?</button>';

}

function phase4(){

message.innerHTML=
"Because curiosity is stronger than goodbye.";

buttons.innerHTML=
'<button onclick="ending()">...</button>';

}

function ending(){

document.body.style.transition="2s";

document.body.style.background="#000";

message.innerHTML=
`
🌙

You expected a game.

Instead, you found a conversation.

Thank you for staying.
`;

buttons.innerHTML=
`
<button onclick="location.reload()">
Restart
</button>
`;

}

setTimeout(()=>{

if(message.innerHTML==="Hello."){

message.innerHTML=
"Still there?";

}

},120000);

</script>

</body>
</html>
