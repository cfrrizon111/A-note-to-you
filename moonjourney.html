<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Journey V2.1</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Georgia,serif;
}

body{
background:#02061d;
overflow:hidden;
color:white;
touch-action:none;
}

#game{
position:fixed;
inset:0;
}

#hud{
position:fixed;
top:15px;
left:15px;
font-size:24px;
z-index:100;
background:rgba(0,0,0,.35);
padding:10px 18px;
border-radius:20px;
backdrop-filter:blur(10px);
}

.moon{
position:absolute;
width:70px;
height:70px;
background:white;
border-radius:50%;
box-shadow:0 0 40px white;
}

.star{
position:absolute;
font-size:32px;
filter:drop-shadow(0 0 10px gold);
}

.cloud{
position:absolute;
font-size:42px;
filter:drop-shadow(0 0 12px white);
}

.control{
position:fixed;
bottom:35px;
width:90px;
height:90px;
border-radius:50%;
border:none;
background:rgba(255,255,255,.12);
backdrop-filter:blur(10px);
font-size:40px;
color:white;
}

#left{
left:20px;
}

#right{
right:20px;
}

#restart{
position:fixed;
top:20px;
right:20px;
padding:10px 16px;
border:none;
border-radius:20px;
background:rgba(255,255,255,.15);
color:white;
font-size:16px;
}

#message{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
text-align:center;
background:rgba(0,0,0,.85);
padding:30px;
z-index:200;
}

.box{
max-width:500px;
background:#111827;
padding:30px;
border-radius:20px;
}

.box h1{
margin-bottom:15px;
}

.box button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:30px;
font-size:18px;
}
</style>
</head>

<body>

<div id="hud">
⭐ <span id="score">0</span>
&nbsp; | &nbsp;
❤️ <span id="lives">3</span>
&nbsp; | &nbsp;
🏆 <span id="level">1</span>
</div>

<button id="restart">Restart</button>

<div id="game"></div>

<button class="control" id="left">⬅️</button>
<button class="control" id="right">➡️</button>

<div id="message">
<div class="box">
<h1>🌙 Journey Complete</h1>
<p>
You followed the stars through the night sky.<br><br>
Some memories fade.<br>
Some remain forever.<br><br>
Thank you for making this journey.
</p>
<button onclick="location.reload()">Play Again</button>
</div>
</div>

<script>

const game=document.getElementById("game");

let score=0;
let lives=3;
let level=1;

let moveLeft=false;
let moveRight=false;

const moon={
x:window.innerWidth/2,
y:window.innerHeight-140,
speed:7
};

const moonEl=document.createElement("div");
moonEl.className="moon";
game.appendChild(moonEl);

let stars=[];
let clouds=[];

function createStar(){

const star=document.createElement("div");
star.className="star";
star.innerHTML="⭐";

const obj={
el:star,
x:Math.random()*(window.innerWidth-40),
y:-50,
speed:2+Math.random()*3
};

star.style.left=obj.x+"px";
star.style.top=obj.y+"px";

game.appendChild(star);
stars.push(obj);
}

function createCloud(){

const cloud=document.createElement("div");
cloud.className="cloud";
cloud.innerHTML="☁️";

const obj={
el:cloud,
x:Math.random()*(window.innerWidth-50),
y:-60,
speed:2+Math.random()*2
};

cloud.style.left=obj.x+"px";
cloud.style.top=obj.y+"px";

game.appendChild(cloud);
clouds.push(obj);
}

setInterval(createStar,1200);
setInterval(createCloud,2600);

function update(){

if(moveLeft) moon.x-=moon.speed;
if(moveRight) moon.x+=moon.speed;

if(moon.x<0) moon.x=0;
if(moon.x>window.innerWidth-70) moon.x=window.innerWidth-70;

moonEl.style.left=moon.x+"px";
moonEl.style.top=moon.y+"px";

stars.forEach((s,index)=>{

s.y+=s.speed;
s.el.style.top=s.y+"px";

if(
s.x<moon.x+60 &&
s.x+30>moon.x &&
s.y<moon.y+60 &&
s.y+30>moon.y
){
score++;
document.getElementById("score").innerText=score;
s.el.remove();
stars.splice(index,1);

if(score%10===0){
level++;
document.getElementById("level").innerText=level;
}
}

if(s.y>window.innerHeight){
s.el.remove();
stars.splice(index,1);
}
});

clouds.forEach((c,index)=>{

c.y+=c.speed;
c.el.style.top=c.y+"px";

if(
c.x<moon.x+60 &&
c.x+40>moon.x &&
c.y<moon.y+60 &&
c.y+40>moon.y
){

lives--;
document.getElementById("lives").innerText=lives;

c.el.remove();
clouds.splice(index,1);

if(lives<=0){
document.getElementById("message").style.display="flex";
}
}

if(c.y>window.innerHeight){
c.el.remove();
clouds.splice(index,1);
}
});

if(score>=30){
document.getElementById("message").style.display="flex";
}

requestAnimationFrame(update);
}

update();

const leftBtn=document.getElementById("left");
const rightBtn=document.getElementById("right");

leftBtn.addEventListener("touchstart",()=>moveLeft=true);
leftBtn.addEventListener("touchend",()=>moveLeft=false);

rightBtn.addEventListener("touchstart",()=>moveRight=true);
rightBtn.addEventListener("touchend",()=>moveRight=false);

leftBtn.addEventListener("mousedown",()=>moveLeft=true);
leftBtn.addEventListener("mouseup",()=>moveLeft=false);

rightBtn.addEventListener("mousedown",()=>moveRight=true);
rightBtn.addEventListener("mouseup",()=>moveRight=false);

document.getElementById("restart").onclick=()=>{
location.reload();
};

</script>

</body>
</html>
