<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Moon Journey V3 Hybrid</title>
<style>
body{margin:0;overflow:hidden;background:#02071d;color:white;font-family:Georgia,serif}
canvas{display:block}
#ui{position:fixed;top:15px;left:15px;font-size:20px;z-index:100}
#box{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.92);padding:25px;border-radius:20px;display:none;max-width:360px;text-align:center;z-index:999}
button{padding:10px 16px;border:none;border-radius:10px;margin:4px}
.ctrl{position:fixed;bottom:20px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:42px}
#left{left:20px} #right{right:20px}
#restart{position:fixed;top:15px;right:15px}
</style>
</head>
<body>
<div id="ui">⭐ <span id="score">0</span> | ❤️ <span id="lives">5</span> | 🏆 <span id="high">0</span></div>
<button id="restart" onclick="location.reload()">🔄</button>

<div id="box"><div id="text"></div><button onclick="closeBox()">Continue</button></div>

<div class="ctrl" id="left">⬅️</div>
<div class="ctrl" id="right">➡️</div>
<canvas id="game"></canvas>

<script>
const c=document.getElementById("game"),x=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;

let score=0,lives=5,paused=false;
let left=false,right=false;
let m={x:c.width/2,y:c.height-120,r:35,s:8};
let stars=[],clouds=[];
let milestones={10:false,25:false,50:false,75:false,100:false};

let high=localStorage.getItem("moonHigh")||0;
document.getElementById("high").innerText=high;

function show(t){paused=true;document.getElementById("text").innerHTML=t;document.getElementById("box").style.display="block";}
function closeBox(){document.getElementById("box").style.display="none";paused=false;}

function milestone(){
if(score===10)show("🌙<br><br>Interesting... Most people stop before reaching here.");
if(score===25)show("🌙<br><br>Why are you still playing?<br><br>Curiosity?");
if(score===50)show("🌙<br><br>You've been here a while.<br><br>I think I remember you.");
if(score===75)show("🌙<br><br>The sky feels different tonight.");
if(score===100)show("🌌<br><br>Some journeys end.<br>Some become memories.<br>Some become constellations.<br><br>❤️ Thank you for staying.");
}

setInterval(()=>{if(!paused)stars.push({x:Math.random()*c.width,y:-20});},800);
setInterval(()=>{if(!paused)clouds.push({x:Math.random()*c.width,y:-20});},2200);

leftBtn=document.getElementById("left");
rightBtn=document.getElementById("right");

leftBtn.addEventListener("touchstart",()=>left=true);
leftBtn.addEventListener("touchend",()=>left=false);
rightBtn.addEventListener("touchstart",()=>right=true);
rightBtn.addEventListener("touchend",()=>right=false);

function update(){
if(paused)return;

if(left)m.x-=m.s;
if(right)m.x+=m.s;

m.x=Math.max(m.r,Math.min(c.width-m.r,m.x));

for(let i=stars.length-1;i>=0;i--){
stars[i].y+=4;
let d=Math.hypot(stars[i].x-m.x,stars[i].y-m.y);
if(d<40){
score++;
document.getElementById("score").innerText=score;
if(score>high){high=score;localStorage.setItem("moonHigh",high);document.getElementById("high").innerText=high;}
milestone();
stars.splice(i,1);
continue;
}
if(stars[i]&&stars[i].y>c.height)stars.splice(i,1);
}

for(let i=clouds.length-1;i>=0;i--){
clouds[i].y+=3;
let d=Math.hypot(clouds[i].x-m.x,clouds[i].y-m.y);
if(d<45){
clouds.splice(i,1);
lives=Math.max(0,lives-1);
document.getElementById("lives").innerText=lives;
if(lives===0){
paused=true;
show("🌑 Journey Over<br><br>Stars Collected: "+score+"<br><br>Press 🔄 to restart.");
return;
}
}
if(clouds[i]&&clouds[i].y>c.height)clouds.splice(i,1);
}
}

function draw(){
x.clearRect(0,0,c.width,c.height);

x.beginPath();
x.arc(m.x,m.y,m.r,0,Math.PI*2);
x.fillStyle="white";
x.shadowBlur=25;
x.shadowColor="white";
x.fill();
x.shadowBlur=0;

stars.forEach(s=>{x.font="28px serif";x.fillText("⭐",s.x,s.y);});
clouds.forEach(s=>{x.font="34px serif";x.fillText("☁️",s.x,s.y);});
}

(function loop(){update();draw();requestAnimationFrame(loop)})();
</script>
</body>
</html>
