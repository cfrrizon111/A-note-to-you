<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Moon Journey V2.1</title>

<style>
body{
margin:0;
overflow:hidden;
background:#02071d;
font-family:Georgia,serif;
color:white;
}

canvas{
display:block;
}

#ui{
position:fixed;
top:15px;
left:15px;
font-size:24px;
z-index:100;
}

.control{
position:fixed;
bottom:40px;
width:90px;
height:90px;
border-radius:50%;
background:rgba(255,255,255,.1);
backdrop-filter:blur(8px);
display:flex;
justify-content:center;
align-items:center;
font-size:45px;
user-select:none;
}

#left{
left:20px;
}

#right{
right:20px;
}

#pause{
position:fixed;
top:15px;
right:15px;
background:rgba(255,255,255,.1);
padding:10px 15px;
border-radius:12px;
font-size:20px;
}

#message{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,.85);
padding:25px;
border-radius:20px;
display:none;
text-align:center;
max-width:300px;
z-index:500;
}

button{
padding:10px 20px;
border:none;
border-radius:10px;
margin-top:10px;
font-size:16px;
}
</style>
</head>

<body>

<div id="ui">
⭐ <span id="stars">0</span>
&nbsp;|&nbsp;
❤️ <span id="lives">3</span>
&nbsp;|&nbsp;
🏆 <span id="level">1</span>
</div>

<div id="pause">⏸️</div>

<div id="message">
<div id="msgText"></div>
<button onclick="closeMessage()">Continue</button>
</div>

<div class="control" id="left">⬅️</div>
<div class="control" id="right">➡️</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let paused=false;

const memories=[
"🌙 The night we talked until sunrise.",
"✨ A laugh that still echoes in my head.",
"💌 The little messages that made my day.",
"🌧️ The comfort you gave during hard times.",
"⭐ Some people become constellations."
];

const moon={
x:canvas.width/2,
y:canvas.height-120,
r:35,
speed:6
};

let moveLeft=false;
let moveRight=false;

let stars=0;
let lives=3;
let level=1;

const starObjects=[];

function spawnStar(){
starObjects.push({
x:Math.random()*(canvas.width-40)+20,
y:-20,
size:22,
speed:2+level
});
}

setInterval(()=>{
if(!paused) spawnStar();
},1200);

function showMessage(text){
document.getElementById("msgText").innerHTML=text;
document.getElementById("message").style.display="block";
paused=true;
}

function closeMessage(){
document.getElementById("message").style.display="none";
paused=false;
}

document.getElementById("pause").onclick=()=>{
paused=!paused;
document.getElementById("pause").innerHTML=
paused ? "▶️" : "⏸️";
};

const leftBtn=document.getElementById("left");
const rightBtn=document.getElementById("right");

leftBtn.addEventListener("touchstart",()=>moveLeft=true);
leftBtn.addEventListener("touchend",()=>moveLeft=false);

rightBtn.addEventListener("touchstart",()=>moveRight=true);
rightBtn.addEventListener("touchend",()=>moveRight=false);

leftBtn.addEventListener("mousedown",()=>moveLeft=true);
leftBtn.addEventListener("mouseup",()=>moveLeft=false);

rightBtn.addEventListener("mousedown",()=>moveRight=true);
rightBtn.addEventListener("mouseup",()=>moveRight=false);

document.addEventListener("keydown",e=>{
if(e.key==="ArrowLeft") moveLeft=true;
if(e.key==="ArrowRight") moveRight=true;
});

document.addEventListener("keyup",e=>{
if(e.key==="ArrowLeft") moveLeft=false;
if(e.key==="ArrowRight") moveRight=false;
});

function update(){

if(paused) return;

if(moveLeft) moon.x-=moon.speed;
if(moveRight) moon.x+=moon.speed;

moon.x=Math.max(moon.r,
Math.min(canvas.width-moon.r,moon.x));

for(let i=starObjects.length-1;i>=0;i--){

let s=starObjects[i];
s.y+=s.speed;

let dx=s.x-moon.x;
let dy=s.y-moon.y;
let dist=Math.sqrt(dx*dx+dy*dy);

if(dist<moon.r+15){

stars++;

document.getElementById("stars").innerText=stars;

if(stars%5===0){
showMessage(
memories[
Math.floor(Math.random()*memories.length)
]
);
}

if(stars%10===0){
level++;
document.getElementById("level").innerText=level;
}

starObjects.splice(i,1);
continue;
}

if(s.y>canvas.height){

lives--;
document.getElementById("lives").innerText=lives;

starObjects.splice(i,1);

if(lives<=0){

showMessage(
"🌙 Journey Complete<br><br>" +
"Stars Collected: "+stars+
"<br><br>You found every light worth keeping."
);

paused=true;
}
}
}
}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

for(let i=0;i<100;i++){

ctx.fillStyle="rgba(255,255,255,.4)";
ctx.fillRect(
(i*97)%canvas.width,
(i*53)%canvas.height,
2,2
);
}

ctx.beginPath();
ctx.arc(moon.x,moon.y,moon.r,0,Math.PI*2);
ctx.fillStyle="white";
ctx.shadowBlur=25;
ctx.shadowColor="white";
ctx.fill();

ctx.shadowBlur=0;

starObjects.forEach(s=>{
ctx.font="30px serif";
ctx.fillText("⭐",s.x,s.y);
});
}

function gameLoop(){
update();
draw();
requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
